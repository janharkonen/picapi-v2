# Local development: an S3-compatible store and the API.
#   docker compose up --build
#   API: http://localhost:8081

x-api-env: &api-env
  S3_ENDPOINT: http://s3:8333
  S3_REGION: us-east-1
  S3_BUCKET: picapi
  S3_ACCESS_KEY_ID: dev
  S3_SECRET_ACCESS_KEY: dev-secret
  S3_USE_PATH_STYLE: "true"
  SIGNING_SECRET: dev-signing-secret-at-least-32-characters
  PICAPI_API_KEY: dev-api-key-0123456789abcdefghijklmn
  BG_MODEL: u2netp

services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data -bucket=picapi -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/picapi"]
      interval: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api-go/Dockerfile
    environment:
      <<: *api-env
      S3_ENV_PREFIX: dev/
      PUBLIC_BASE_URL: http://localhost:8081
    ports:
      - "8081:8080"
    depends_on:
      s3:
        condition: service_healthy

volumes:
  s3-data:
